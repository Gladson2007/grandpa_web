<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grandpa's Memories</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: #fcf8f1;
      color: #2f2924;
      font: 16px/1.5 Georgia, serif;
    }

    main { max-width: 1100px; margin: auto; }
    header { text-align: center; padding: 15px; }

    h1 {
      font-size: clamp(32px, 6vw, 54px);
      font-weight: 400;
      margin: 8px;
    }

    .muted { color: #796e63; }

    .panel {
      background: #fffdfa;
      border: 1px solid #e8ddd0;
      border-radius: 14px;
      padding: 18px;
      margin: 16px 0;
    }

    .stage {
      width: 100%;
      height: min(72vh, 760px);
      min-height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 10px;
      background: #211e1b;
      color: white;
      position: relative;
    }

    .stage img,
    .stage video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      background: #211e1b;
    }

    .caption {
      position: absolute;
      bottom: 10px;
      left: 10px;
      right: 10px;
      z-index: 2;
      background: #0009;
      color: white;
      padding: 8px;
      text-align: center;
      font-size: 20px;
      border-radius: 6px;
      pointer-events: none;
    }

    .controls,
    .settings,
    .item {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .controls {
      justify-content: center;
      margin-top: 12px;
    }

    button,
    .file-button {
      display: inline-block;
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      background: #a25849;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button.secondary {
      background: #efe6da;
      color: #2f2924;
    }

    input[type="file"] { display: none; }

    .file-button { margin: 8px 0; }

    .settings { margin-top: 14px; }
    .settings label { display: block; margin: 8px 0; }

    .item {
      padding: 8px;
      margin-top: 8px;
      background: white;
      border: 1px solid #e8ddd0;
      border-radius: 8px;
    }

    .item img,
    .item video {
      width: 56px;
      height: 42px;
      object-fit: cover;
      border-radius: 5px;
    }

    .filename {
      flex: 1;
      min-width: 100px;
    }

    input[type="text"],
    input[type="number"] {
      padding: 8px;
      border: 1px solid #e8ddd0;
      border-radius: 6px;
    }

    #musicName,
    #status {
      display: block;
      color: #796e63;
      margin-top: 6px;
    }

    @media (max-width: 600px) {
      body { padding: 10px; }
      .panel { padding: 12px; }
      .stage {
        height: 65vh;
        min-height: 240px;
      }
      .item input[type="text"] { width: 100%; }
    }
  </style>
</head>

<body>
<main>
  <header>
    <div class="muted">A family remembrance</div>
    <h1 id="heading">Grandpa's Memories</h1>
    <p class="muted" id="dedication">
      Forever loved, always remembered
    </p>
  </header>

  <section class="panel">
    <div class="stage" id="stage">
      Add your family photos and videos below
    </div>

    <div class="controls">
      <button class="secondary" id="previous">← Previous</button>
      <span id="counter">0 / 0</span>
      <button class="secondary" id="next">Next →</button>
      <button id="play">▶ Play slideshow</button>
    </div>
  </section>

  <section class="panel">
    <strong>Add photos and videos</strong>
    <p class="muted">Choose multiple files from your device.</p>

    <label class="file-button">
      ＋ Choose photos and videos
      <input id="files" type="file" accept="image/*,video/*" multiple>
    </label>

    <div id="mediaList"></div>
  </section>

  <section class="panel">
    <strong>Personalize the slideshow</strong>

    <div class="settings">
      <label>
        Title<br>
        <input id="titleInput" type="text" value="Grandpa's Memories">
      </label>

      <label>
        Dedication or ceremony date<br>
        <input id="dedicationInput" type="text"
               value="Forever loved, always remembered">
      </label>

      <label>
        Seconds per photo<br>
        <input id="seconds" type="number" min="2" max="30" value="5">
      </label>

      <label>
        Choose background music<br>
        <input id="music" type="file" accept="audio/*">
        <span id="musicName">No music selected</span>
        <label class="file-button">
          Choose music file
          <input id="musicPicker" type="file" accept="audio/*">
        </label>
      </label>

      <label>
        Music volume<br>
        <input id="volume" type="range" min="0" max="30" value="12">
      </label>
    </div>

    <button id="export">⬇ Export slideshow video</button>
    <div id="status"></div>
  </section>
</main>

<audio id="audio" loop></audio>

<script>
const $ = id => document.getElementById(id);
const items = [];

let current = 0;
let timer = null;
let playing = false;
let musicUrl = null;

const stage = $("stage");
const audio = $("audio");

function updateHeader() {
  $("heading").textContent =
    $("titleInput").value || "Grandpa's Memories";

  $("dedication").textContent =
    $("dedicationInput").value || "";
}

function render() {
  updateHeader();
  $("mediaList").innerHTML = "";

  if (!items.length) {
    stage.textContent = "Add your family photos and videos below";
    $("counter").textContent = "0 / 0";
    return;
  }

  current = Math.max(0, Math.min(current, items.length - 1));
  const item = items[current];

  stage.innerHTML = "";

  const media = document.createElement(
    item.type === "video" ? "video" : "img"
  );

  media.src = item.url;
  media.id = "currentMedia";

  if (item.type === "video") {
    media.controls = true;
    media.playsInline = true;
  } else {
    media.alt = item.file.name;
  }

  stage.appendChild(media);

  if (item.caption) {
    const caption = document.createElement("div");
    caption.className = "caption";
    caption.textContent = item.caption;
    stage.appendChild(caption);
  }

  $("counter").textContent = `${current + 1} / ${items.length}`;

  items.forEach((entry, index) => {
    const row = document.createElement("div");
    row.className = "item";

    const thumbnail = document.createElement(
      entry.type === "video" ? "video" : "img"
    );
    thumbnail.src = entry.url;
    thumbnail.muted = true;

    const name = document.createElement("span");
    name.className = "filename";
    name.textContent =
      `${entry.type === "video" ? "▶ " : "▧ "}${entry.file.name}`;

    const captionInput = document.createElement("input");
    captionInput.type = "text";
    captionInput.placeholder = "Optional caption";
    captionInput.value = entry.caption;

    captionInput.addEventListener("input", () => {
      entry.caption = captionInput.value;

      if (index === current) {
        const oldCaption = stage.querySelector(".caption");

        if (entry.caption) {
          if (oldCaption) {
            oldCaption.textContent = entry.caption;
          } else {
            const caption = document.createElement("div");
            caption.className = "caption";
            caption.textContent = entry.caption;
            stage.appendChild(caption);
          }
        } else if (oldCaption) {
          oldCaption.remove();
        }
      }
    });

    const up = makeButton("↑", () => move(index, -1));
    const down = makeButton("↓", () => move(index, 1));
    const removeButton = makeButton("Remove", () => removeItem(index));

    up.className = down.className = removeButton.className = "secondary";

    row.append(thumbnail, name, captionInput, up, down, removeButton);

    row.addEventListener("click", event => {
      if (
        !event.target.closest("button") &&
        event.target !== captionInput
      ) {
        current = index;
        render();
      }
    });

    $("mediaList").appendChild(row);
  });
}

function makeButton(text, action) {
  const button = document.createElement("button");
  button.textContent = text;
  button.onclick = action;
  return button;
}

function move(index, direction) {
  const target = index + direction;

  if (target < 0 || target >= items.length) return;

  [items[index], items[target]] = [items[target], items[index]];
  current = target;
  render();
}

function removeItem(index) {
  URL.revokeObjectURL(items[index].url);
  items.splice(index, 1);
  current = Math.min(current, Math.max(0, items.length - 1));
  render();
}

$("files").addEventListener("change", event => {
  for (const file of event.target.files) {
    if (file.type.startsWith("image/") || file.type.startsWith("video/")) {
      items.push({
        file,
        url: URL.createObjectURL(file),
        type: file.type.startsWith("video/") ? "video" : "image",
        caption: ""
      });
    }
  }

  event.target.value = "";
  render();
});

$("titleInput").addEventListener("input", updateHeader);
$("dedicationInput").addEventListener("input", updateHeader);

function show(index) {
  if (!items.length) return;

  current = (index + items.length) % items.length;
  render();
}

$("previous").onclick = () => show(current - 1);
$("next").onclick = () => show(current + 1);

function stopSlideshow() {
  playing = false;
  clearTimeout(timer);
  $("play").textContent = "▶ Play slideshow";
  audio.pause();
}

function advanceSlideshow() {
  if (!playing) return;

  const item = items[current];

  if (item?.type === "video") {
    const video = $("currentMedia");
    video.onended = () => show(current + 1);
    video.play().catch(() => {});
    return;
  }

  const seconds = Math.max(2, Number($("seconds").value) || 5);

  timer = setTimeout(() => {
    show(current + 1);
  }, seconds * 1000);
}

$("play").onclick = () => {
  if (!items.length) return;

  if (playing) {
    stopSlideshow();
    return;
  }

  playing = true;
  $("play").textContent = "❚❚ Pause slideshow";

  if (audio.src) {
    audio.play().catch(() => {});
  }

  advanceSlideshow();
};

const stageObserver = new MutationObserver(() => {
  if (playing) {
    clearTimeout(timer);
    advanceSlideshow();
  }
});
stageObserver.observe(stage, { childList: true });

function setMusicFile(file) {
  if (!file) return;

  if (musicUrl) URL.revokeObjectURL(musicUrl);

  musicUrl = URL.createObjectURL(file);
  audio.src = musicUrl;
  audio.volume = Number($("volume").value) / 100;
  $("musicName").textContent = `Selected: ${file.name}`;
}

$("music").addEventListener("change", event => {
  setMusicFile(event.target.files[0]);
});

$("musicPicker").addEventListener("change", event => {
  setMusicFile(event.target.files[0]);
});

$("volume").addEventListener("input", event => {
  audio.volume = Number(event.target.value) / 100;
});

function drawFitted(context, media, width, height) {
  const mediaWidth = media.videoWidth || media.naturalWidth;
  const mediaHeight = media.videoHeight || media.naturalHeight;

  if (!mediaWidth || !mediaHeight) return;

  const scale = Math.min(
    width / mediaWidth,
    height / mediaHeight
  );

  const drawWidth = mediaWidth * scale;
  const drawHeight = mediaHeight * scale;

  context.drawImage(
    media,
    (width - drawWidth) / 2,
    (height - drawHeight) / 2,
    drawWidth,
    drawHeight
  );
}

function drawCaption(context, text, width, height) {
  if (!text) return;

  context.fillStyle = "#0009";
  context.fillRect(0, height - 78, width, 78);
  context.fillStyle = "white";
  context.font = "30px Georgia";
  context.textAlign = "center";
  context.fillText(text, width / 2, height - 28, width - 50);
}

async function exportVideo() {
  if (!items.length) {
    $("status").textContent = "Add photos or videos first.";
    return;
  }

  if (
    !window.MediaRecorder ||
    !HTMLCanvasElement.prototype.captureStream
  ) {
    $("status").textContent =
      "Use a recent Chrome or Edge browser for video export.";
    return;
  }

  stopSlideshow();

  const exportButton = $("export");
  exportButton.disabled = true;
  $("status").textContent = "Preparing video. Keep this page open.";

  const canvas = document.createElement("canvas");
  canvas.width = 1920;
  canvas.height = 1080;

  const context = canvas.getContext("2d");
  const stream = canvas.captureStream(30);

  let audioContext = null;
  let recorder = null;

  try {
    if (audio.src) {
      audioContext = new AudioContext();

      const source = audioContext.createMediaElementSource(audio);
      const gain = audioContext.createGain();
      const destination = audioContext.createMediaStreamDestination();

      gain.gain.value = Number($("volume").value) / 100;
      source.connect(gain);
      gain.connect(audioContext.destination);
      gain.connect(destination);

      destination.stream.getAudioTracks().forEach(track => {
        stream.addTrack(track);
      });

      audio.currentTime = 0;
      await audioContext.resume();
      await audio.play();
    }

    const mimeType = MediaRecorder.isTypeSupported(
      "video/webm;codecs=vp9,opus"
    )
      ? "video/webm;codecs=vp9,opus"
      : "video/webm";

    recorder = new MediaRecorder(stream, { mimeType });
    const chunks = [];

    recorder.ondataavailable = event => {
      if (event.data.size) chunks.push(event.data);
    };

    const finished = new Promise(resolve => {
      recorder.onstop = resolve;
    });

    recorder.start();

    for (let index = 0; index < items.length; index++) {
      const item = items[index];

      $("status").textContent =
        `Recording memory ${index + 1} of ${items.length}…`;

      if (item.type === "image") {
        const image = new Image();
        image.src = item.url;
        await image.decode();

        context.fillStyle = "#211e1b";
        context.fillRect(0, 0, canvas.width, canvas.height);
        drawFitted(context, image, canvas.width, canvas.height);
        drawCaption(context, item.caption, canvas.width, canvas.height);

        const seconds = Math.max(
          2,
          Number($("seconds").value) || 5
        );

        await new Promise(resolve => {
          setTimeout(resolve, seconds * 1000);
        });
      } else {
        const video = document.createElement("video");
        video.src = item.url;
        video.muted = true;
        video.playsInline = true;

        await new Promise((resolve, reject) => {
          video.onloadedmetadata = resolve;
          video.onerror = reject;
        });

        await video.play();

        await new Promise(resolve => {
          function drawFrame() {
            context.fillStyle = "#211e1b";
            context.fillRect(0, 0, canvas.width, canvas.height);
            drawFitted(context, video, canvas.width, canvas.height);
            drawCaption(context, item.caption, canvas.width, canvas.height);

            if (video.ended) {
              resolve();
            } else {
              requestAnimationFrame(drawFrame);
            }
          }

          drawFrame();
        });

        video.remove();
      }
    }

    recorder.stop();
    await finished;

    const blob = new Blob(chunks, { type: mimeType });
    const downloadUrl = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = downloadUrl;
    link.download = "grandpa-memories.webm";
    link.click();

    setTimeout(() => URL.revokeObjectURL(downloadUrl), 60000);

    $("status").textContent = "Finished. Your video has downloaded.";
  } catch (error) {
    console.error(error);

    if (recorder?.state === "recording") {
      recorder.stop();
    }

    $("status").textContent =
      "Export failed. Try a smaller file or another browser.";
  } finally {
    exportButton.disabled = false;
    audio.pause();

    if (audioContext) {
      await audioContext.close().catch(() => {});
    }

    stream.getTracks().forEach(track => track.stop());
  }
}

$("export").onclick = exportVideo;

render();
</script>
</body>
</html>
